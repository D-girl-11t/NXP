%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx519.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX519 1/2.5-Inch 16Mpixel CMOS Digital Image Sensor

maintainers:
  - Lee Jackson <info@arducam.com>

description: |-
  The Sony IMX519 is a 1/2.5-inch CMOS active pixel digital image sensor with
  an active array of 4656H x 3496V. It is programmed over I2C at the fixed
  address 0x1a and sends image data over MIPI CSI-2 as RAW10 Bayer.

  On NXP i.MX93 the sensor is wired to the 2-lane CSI-2 receiver feeding the
  ISI, which is limited to 2K horizontal, so the link runs at 408 MHz
  (816 Mbps per lane) and only the 1920x1080 and 1280x720 modes are usable.
  Working examples for both i.MX93 boards are in the dts/ directory of this
  repository.

properties:
  compatible:
    const: sony,imx519

  reg:
    description: I2C device address
    maxItems: 1

  clocks:
    description: Sensor master clock (INCK), 24 MHz.
    maxItems: 1

  clock-names:
    const: xclk

  VANA-supply:
    description: Analog voltage supply, 2.8 volts

  VDIG-supply:
    description: Digital core voltage supply, 1.05 volts

  VDDL-supply:
    description: Digital I/O voltage supply, 1.8 volts

  reset-gpios:
    description: |-
      Reference to the GPIO that brings the sensor out of reset, if any. The
      driver drives it logical high to enable the sensor and logical low to
      disable it, so a board where the pin is an active-high module enable
      (the Raspberry Pi camera connector's CAM_IO0, for instance) must use
      GPIO_ACTIVE_HIGH rather than GPIO_ACTIVE_LOW.
    maxItems: 1

  lens-focus:
    description: |-
      Phandle to the focus lens controller. On the Arducam 16MP autofocus
      module this is the AK7375 voice-coil driver at I2C 0x0c.
    $ref: /schemas/types.yaml#/definitions/phandle

  rotation: true

  orientation: true

  # See video-interfaces.yaml for the full endpoint schema.
  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            description: |-
              The sensor supports two-lane or four-lane operation. i.MX93 has
              two lanes, so the property must be <1 2>.
            items:
              - const: 1
              - const: 2

          clock-noncontinuous: true

          link-frequencies:
            description: |-
              Allowed CSI-2 link frequencies. The driver accepts the single
              value it was configured for; on i.MX93 that is 408000000.

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - VANA-supply
  - VDIG-supply
  - VDDL-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@1a {
            compatible = "sony,imx519";
            reg = <0x1a>;

            clocks = <&imx519_clk>;
            clock-names = "xclk";

            reset-gpios = <&gpio_expander 22 GPIO_ACTIVE_HIGH>;

            VANA-supply = <&imx519_vana>;   /* 2.8 V */
            VDIG-supply = <&imx519_vdig>;   /* 1.05 V */
            VDDL-supply = <&imx519_vddl>;   /* 1.8 V */

            rotation = <0>;
            orientation = <2>;
            lens-focus = <&ak7375>;

            port {
                imx519_ep: endpoint {
                    remote-endpoint = <&mipi_csi_in>;
                    clock-lanes = <0>;
                    data-lanes = <1 2>;
                    clock-noncontinuous;
                    link-frequencies = /bits/ 64 <408000000>;
                };
            };
        };

        ak7375: focus@c {
            compatible = "asahi-kasei,ak7375";
            reg = <0x0c>;
            vdd-supply = <&imx519_vana>;
        };
    };

...
