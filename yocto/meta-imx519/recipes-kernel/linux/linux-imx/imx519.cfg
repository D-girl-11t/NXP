# Kernel config fragment for the IMX519 on i.MX93.
#
# scripts/install-into-kernel.sh copies this to
# arch/arm64/configs/imx519.config, where it is merged on top of a base
# config:
#
#   ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/imx519.config
#   make olddefconfig
#
# Yocto picks it up through DELTA_KERNEL_DEFCONFIG in the bbappend.

# Media core needed by any V4L2 sensor subdev.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L2_FWNODE=y

# The sensor and its voice-coil focus driver.
CONFIG_VIDEO_IMX519=m
CONFIG_VIDEO_AK7375=m

# Buses and resources the sensor node depends on.
CONFIG_I2C=y
CONFIG_GPIOLIB=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
