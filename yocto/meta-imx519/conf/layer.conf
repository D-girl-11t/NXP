# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imx519"
BBFILE_PATTERN_imx519 = "^${LAYERDIR}/"
BBFILE_PRIORITY_imx519 = "8"

LAYERSERIES_COMPAT_imx519 = "scarthgap nanbield kirkstone mickledore"
